# ============================================================
# OPTIONS
# ============================================================

# True color + tmux-internal capability term
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Zero ESC delay so vim/neovim feel native
set -sg escape-time 0

# Mouse: resize panes, scroll, click to focus
set -g mouse on

# Numbering: windows + panes start at 1 (matches prefix 1-9 keys)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Large scrollback (build logs, Claude Code output)
set -g history-limit 50000

# vi keys in copy-mode
setw -g mode-keys vi

# Let editors detect focus events
set -g focus-events on

# Disable bell entirely
set -g bell-action none

# Clipboard: any copy-pipe without an explicit command (e.g. copy-mode Enter)
# goes to the system clipboard. Works with or without tmux-yank.
# Later lines win: X11 (xclip) < Wayland (wl-copy) < macOS (pbcopy).
if-shell 'command -v xclip >/dev/null' 'set -s copy-command "xclip -selection clipboard"'
if-shell 'command -v wl-copy >/dev/null' 'set -s copy-command "wl-copy"'
if-shell 'command -v pbcopy >/dev/null' 'set -s copy-command "pbcopy"'

# ============================================================
# KEYBINDINGS
# ============================================================

# --- Splits (shift-free) ---
# `\` and `-` both avoid Shift. Default `"` and `%` are left intact.
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Pane navigation (vim hjkl) ---
# Note: `l` overrides default last-window; last-window moved to Tab.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window

# --- Pane resize (vim HJKL, capital) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

# --- Copy-mode (vi-style) ---
# `v` starts selection like vim visual mode; `y` / Enter / mouse-drag copy to clipboard.
bind -T copy-mode-vi v send-keys -X begin-selection

# ============================================================
# STATUS BAR
# ============================================================

# Default tmux colors; right side shows plain HH:MM.
set -g status-right-length 20
set -g status-right " %H:%M "

# ============================================================
# NOTIFICATIONS
# ============================================================

# Visual-only notifications (no sound)
set -g visual-activity on
set -g visual-silence on
set -g activity-action none
set -g silence-action none

# Activity monitoring is opt-in per window (off by default — build logs are noisy).
# `prefix a` : toggle monitor-activity on current window
# `prefix m` : toggle monitor-silence (10s) — e.g. "tell me when Claude finishes"
bind a if-shell -F '#{monitor-activity}' \
    'setw monitor-activity off ; display-message "monitor-activity OFF"' \
    'setw monitor-activity on ; display-message "monitor-activity ON"'
bind m if-shell -F '#{monitor-silence}' \
    'setw monitor-silence 0 ; display-message "monitor-silence OFF"' \
    'setw monitor-silence 10 ; display-message "monitor-silence ON (10s)"'

# ============================================================
# PLUGINS (optional — loaded only if tpm is installed)
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# resurrect: capture pane contents; restore nvim sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# continuum: auto-save every 15 minutes; restore manually with prefix C-r
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# Must be last. On machines without tpm this is skipped silently,
# so this file alone gives a working setup anywhere.
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' 'run ~/.tmux/plugins/tpm/tpm'

# tmux-sensible adds `prefix R` (reload) — duplicate of `prefix r` above.
unbind R
